name: oncoguardian
description: "A comprehensive health monitoring app for cancer patients, providing personalized insights and support resources to enhance patient care and well-being."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1
  flutter: 3.38.3

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  # Firebase & Backend
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  # Routing & Localization
  go_router: ^17.1.0
  # State Management & BLoC
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^10.0.0
  bloc_concurrency: ^0.3.0
  # Network & API
  dio: ^5.7.0
  # Theme & UI
  flutter_svg: ^2.0.16
  flutter_easyloading: ^3.0.5
  flutter_native_splash: ^2.4.4
  pinput: ^6.0.2
  shimmer: ^3.0.0
  # Utilities & Helpers
  get_it: ^8.0.3
  equatable: ^2.0.7
  intl: ^0.20.2
  logging: ^1.3.0
  stream_transform: ^2.1.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  copy_with_extension_gen: ^6.0.0
  build_runner: ^2.5.3
  freezed: ^3.0.6
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  adaptive_icon_monochrome: "assets/images/app_logo.png"
  image_path_ios_dark_transparent: "assets/images/app_logo.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/app_logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"

flutter_native_splash:
  image: "assets/images/logo.png"
  image_dark: "assets/images/logo.png"
  color: "#ffffff"
  color_dark: "#000000"
  color_web: "#ffffff"
  color_dark_web: "#000000"
  image_web: "assets/images/logo.png"
  image_dark_web: "assets/images/logo.png"

  android_12:
    image: "assets/images/app_logo.png"
    image_dark: "assets/images/app_logo.png"
    color: "#ffffff"
    color_dark: "#000000"
    icon_background_color: "#ffffff"
    icon_background_color_dark: "#000000"

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/images/
